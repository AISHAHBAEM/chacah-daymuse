*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#f6e6df,#faf3f0 45%,#f8eee9);background-attachment:fixed;overflow-x:hidden}
.app{display:flex;gap:18px;padding:18px;max-width:1240px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--gs);border-radius:22px}
nav{width:200px;flex:none;padding:20px 14px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:6px}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600;padding:0 10px}.sub{font-size:12px;color:var(--mut);padding:0 10px 16px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:500 15px 'DM Sans',sans-serif;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left}
nav button.on{background:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(181,130,122,.35)}nav button:not(.on):hover{background:#f6e9e4}
nav .fab{display:none}
main{flex:1;min-width:0;position:relative}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0}h1{font-size:30px}h2{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:0;border-radius:999px;padding:11px 20px;font:600 14px 'DM Sans',sans-serif;cursor:pointer;color:#fff;background:var(--acc);box-shadow:0 5px 14px rgba(181,130,122,.3)}
.btn.g{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--gb)}
.ib{border:0;background:#f6e9e4;color:var(--ink);border-radius:10px;padding:6px 9px;cursor:pointer;font-size:13px}
input,select,textarea{font:400 14px 'DM Sans',sans-serif;color:var(--ink);background:var(--inp);border:1px solid var(--gb);border-radius:12px;padding:9px 12px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:80px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.3fr 1fr}
.card{padding:18px}
.hero{position:relative;overflow:hidden;padding:26px;min-height:210px;margin-bottom:14px;background:linear-gradient(120deg,#fbf1ec,#f6dcd6);padding-right:44%}
.hero h1{font-size:34px}.hero .co{font-size:13px;letter-spacing:.02em;margin-top:2px}
.pill{display:inline-block;background:#fff;border-radius:14px;padding:8px 14px;font-weight:600;font-size:14px;margin:14px 0 10px;box-shadow:var(--gs)}

.hero>*{position:relative;z-index:1}
.tul{position:absolute;right:10px;bottom:0;height:100%;max-height:230px;pointer-events:none}
.q{font-family:'Playfair Display',serif;font-style:italic;color:var(--mut);margin:0 0 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{border:1px solid var(--gb);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;font:500 14px 'DM Sans',sans-serif;color:var(--ink);box-shadow:var(--gs)}
.tile i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}.tile small{display:block;color:var(--mut)}
.ov{display:flex;align-items:center;justify-content:space-between;gap:14px}.ov ul{list-style:none;margin:0;padding:0;flex:1}.ov li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}.ov li b{margin-left:auto}.ov li span{width:10px;height:10px;border-radius:50%}
.donut{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{width:80px;height:80px;border-radius:50%;background:#fbf5f2;display:grid;place-content:center;text-align:center}.donut b{font-family:'Playfair Display',serif;font-size:22px}.donut span{font-size:10px;color:var(--mut)}
.rem{background:#fbe6e6;border-radius:12px;padding:8px 12px;margin-top:6px;font-size:14px}.rem small{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gb)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
.st{border:0;border-radius:999px;padding:6px 10px;font-weight:600;font-size:12px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--gb);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 13px 'DM Sans',sans-serif;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input[type=search]{flex:1;min-width:160px}
.tw{overflow-x:auto;padding:6px}table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:12px;color:var(--mut);padding:10px;font-weight:600}td{padding:10px;vertical-align:top;border-top:1px solid var(--gb);font-size:14px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;cursor:pointer;overflow-wrap:anywhere}.clamp.open{-webkit-line-clamp:unset}
tr.over td:first-child{box-shadow:inset 3px 0 #e8a5a5}tr.over{background:rgba(240,170,170,.12)}tr.urg{background:rgba(245,170,185,.22)}tr.done .tt{text-decoration:line-through;opacity:.6}
.tt{font-weight:600;overflow-wrap:anywhere}.tag{font-size:11px;color:#b0345a;font-weight:600}
.notes{columns:3 230px;column-gap:14px}.note{break-inside:avoid;margin-bottom:14px;padding:16px;border-radius:18px;border:1px solid var(--gb);box-shadow:var(--gs)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 12px}.note small{color:var(--mut);font-weight:600}
.spr{position:absolute;right:0;top:-18px;width:120px;pointer-events:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;color:var(--mut);font-weight:600;padding:4px}
.day{min-height:92px;border-radius:14px;background:#fff;border:1px solid var(--gb);padding:6px;cursor:pointer;overflow:hidden}.day.o{opacity:.4}.day.td{border-color:var(--acc);background:#fbeee9}.day.sel{box-shadow:0 0 0 2px var(--acc)}
.day>b{font-size:12px}.cc{font-size:11px;border-radius:8px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mo{position:fixed;inset:0;background:rgba(74,53,48,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;background:#fbf5f2}

 const ring=x=>{const f=tot?cnt(x)/tot:0;return`<div class="rg"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#f1e4de" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="${dc[x]}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(f*113.1).toFixed(1)} 113.1"/></svg><b>${cnt(x)}</b>${x}</div>`};
 const tk=t=>`<div class="tk"><div class="tm">${ft(t.time)||'Anytime'}</div><div class="tb"><b>${esc(t.title)}</b>${t.remark?`<span>${esc(t.remark)}</span>`:''}</div>${stSel(t)}</div>`;
 const ti=t=>`<div class="ti" style="--c:${dc[t.status]}"><small>${new Date(t.date+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}${t.time?' · '+ft(t.time):''}</small><b>${esc(t.title)}</b>${t.reminder?`<em>${esc(t.reminder)}</em>`:''}${stSel(t)}</div>`;
 const pin=(x,i)=>`<div class="pin" data-en="${x.id}" style="background:${NC[i%NC.length]};--r:${[-1,.8,.4,-.6,1][i%5]}deg"><small>${x.pin?'Pinned · ':''}${fd(x.date)}</small><p>${esc(x.remark)}</p></div>`;
 const plus='<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
 m.innerHTML=`<div class="board"><section class="wel"><div class="dn"><span class="bg">${n.getDate()}</span><span class="dm">${n.toLocaleDateString('en-GB',{weekday:'long'})}<br>${n.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span></div>
 <h1>${g}, Chacah</h1><p class="q">“${Q[n.getDate()%Q.length]}”</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="addt">${plus} Add Task</button><button class="btn g" data-a="addn">${plus} Add Note</button></div></section>
 <div class="col">${DD}<div class="pn"><small>to remember</small><p>${rn?esc(rn.reminder):'Take it one soft step at a time.'}</p></div><div class="pol"><i></i><span>daymuse</span></div>${SPR}</div>

 <section class="sheet"><div class="sh2"><h2>Today</h2><span>${tt.length?tt.length+(tt.length>1?' tasks':' task'):'nothing yet'}</span></div>${tt.map(tk).join('')||`<div class="emp">${CUP}<p>A quiet day ahead.</p><button class="btn" data-a="addt" data-date="${td}">${plus} Add a task</button></div>`}</section>
 <section class="upc"><div class="hd"><h2>Coming up</h2></div><div class="tl">${up.map(ti).join('')||'<div class="empty" style="text-align:left;padding:6px 20px">Nothing upcoming.</div>'}</div></section>
 <section class="nts"><div class="hd"><h2>On the board</h2><button class="ib" data-v="notes">All notes</button></div><div class="pins">${nn.map(pin).join('')||'<div class="empty">No notes yet.</div>'}</div></section></div>`}
function tasksV(m){m.innerHTML=`<div class="top"><h1>Task List</h1><button class="btn" data-a="addt">+ Add Task</button></div>
 <div class="chips">${['All',...S].map(s=>`<button class="chip${F.st===s?' on':''}" data-f="${s}">${s}</button>`).join('')}</div>
 <div class="tools"><input type="search" id="q" placeholder="Search title, remark or reminder" value="${esc(F.q)}">
 <select id="scope"><option value="all">All dates</option><option value="over">Overdue</option><option value="up">Upcoming</option><option value="done">Completed</option></select>
 <input type="date" id="fdate" value="${F.date}" aria-label="Filter by date">
 <select id="sort"><option value="date">Sort by date</option><option value="time">Sort by time</option><option value="title">Sort by title</option></select>
 <button class="ib" id="clr">Clear</button></div><div class="glass tw" id="tl"></div>`;
 $('#scope').value=F.scope;$('#sort').value=F.sort;list()}
function list(){let a=D.tasks.filter(t=>(F.st==='All'||t.status===F.st)&&(!F.date||t.date===F.date));
 const q=F.q.toLowerCase();if(q)a=a.filter(t=>[t.title,t.remark,t.reminder].join(' ').toLowerCase().includes(q));
 if(F.scope==='over')a=a.filter(over);if(F.scope==='up')a=a.filter(t=>t.status!=='Completed'&&t.date>=TD()&&!over(t));if(F.scope==='done')a=a.filter(t=>t.status==='Completed');
 a.sort((x,y)=>F.sort==='title'?x.title.localeCompare(y.title):F.sort==='time'?(x.time||'99').localeCompare(y.time||'99')||key(x).localeCompare(key(y)):key(x).localeCompare(key(y)));
 $('#tl').innerHTML=a.length?`<table><thead><tr><th>Task</th><th>Remark</th><th>Status</th><th>Date</th><th>Time</th><th>Reminder</th><th>Actions</th></tr></thead><tbody>${a.map(t=>`<tr class="${over(t)?'over':''} ${t.status==='Urgent'?'urg':''} ${t.status==='Completed'?'done':''}"><td><div class="tt">${esc(t.title)}</div>${over(t)?'<span class="tag">Overdue</span>':''}</td>
 <td><div class="clamp" data-x>${esc(t.remark)||'—'}</div></td><td>${stSel(t)}</td><td>${fd(t.date)}</td><td>${ft(t.time)||'—'}</td><td><div class="clamp" data-x>${esc(t.reminder)||'—'}</div></td>
 <td style="white-space:nowrap"><button class="ib" data-e="${t.id}">Edit</button> <button class="ib" data-d="${t.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No tasks match. Try a different filter or add a new task.</div>'}
function noteC(n){const i=D.notes.indexOf(n);return`<div class="note" style="background:${NC[i%NC.length]}"><small>${n.pin?'📌 ':''}${fd(n.date)}</small><p>${esc(n.remark)}</p><button class="ib" data-pn="${n.id}">${n.pin?'Unpin':'Pin'}</button> <button class="ib" data-en="${n.id}">Edit</button> <button class="ib" data-dn="${n.id}">Delete</button></div>`}
function notesV(m){m.innerHTML=SPR+`<div class="top"><h1>Notes</h1><button class="btn" data-a="addn">+ Add Note</button></div><div class="tools"><input type="search" id="nq" placeholder="Search notes" value="${esc(NF.q)}"><select id="ns"><option value="new">Newest first</option><option value="old">Oldest first</option></select></div><div id="nl"></div>`;$('#ns').value=NF.sort;nlist()}
function nlist(){const q=NF.q.toLowerCase();let a=D.notes.filter(n=>n.remark.toLowerCase().includes(q));
 a.sort((x,y)=>(y.pin-x.pin)||(NF.sort==='new'?y.date.localeCompare(x.date):x.date.localeCompare(y.date)));
 $('#nl').innerHTML=a.length?`<div class="notes">${a.map(noteC).join('')}</div>`:'<div class="glass empty">No notes found. Add one to start.</div>'}
function calV(m){if(!cal.y){const n=new Date();cal={y:n.getFullYear(),m:n.getMonth(),sel:TD()}}
 const first=new Date(cal.y,cal.m,1),start=new Date(cal.y,cal.m,1-first.getDay()),td=TD();let cells='';
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),s=iso(d),ts=D.tasks.filter(t=>t.date===s).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 cells+=`<div class="day${d.getMonth()!==cal.m?' o':''}${s===td?' td':''}${s===cal.sel?' sel':''}" data-day="${s}"><b>${d.getDate()}</b>${ts.slice(0,3).map(dot).join('')}${ts.length>3?`<div class="cc">+${ts.length-3} more</div>`:''}</div>`}
 const st=D.tasks.filter(t=>t.date===cal.sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 m.innerHTML=`<div class="top"><h1>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h1><div style="display:flex;gap:8px"><button class="btn g" data-cn="-1">‹ Prev</button><button class="btn g" data-cn="0">Today</button><button class="btn g" data-cn="1">Next ›</button></div></div>
 <div class="grid g2" style="grid-template-columns:2fr 1fr;align-items:start"><div class="glass card"><div class="cal">${'SMTWTFS'.split('').map((c,i)=>`<div class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</div>`).join('')}${cells}</div></div>
 <div class="glass card"><div class="top" style="margin-bottom:6px"><h2>${fd(cal.sel)}</h2><button class="btn" data-a="addt" data-date="${cal.sel}">+ Add</button></div>${st.map(t=>`<div class="row"><div class="t" data-t="${t.id}" style="cursor:pointer"><b>${esc(t.title)}</b><small>${ft(t.time)||'Any time'}</small></div>${stSel(t)}</div>`).join('')||'<div class="empty">No tasks on this day.</div>'}</div></div>`}
function modal(h){$('#modal').innerHTML=`<div class="mo" id="mo"><div class="glass md">${h}</div></div>`}
const close=()=>$('#modal').innerHTML='';
function taskForm(t,date){t=t||{status:'Pending',date:date||TD()};modal(`<h2>${t.id?'Edit task':'New task'}</h2><label>Task title</label><input id="f1" value="${esc(t.title)}" placeholder="e.g. Submit E-Invoice"><label>Remark</label><textarea id="f2">${esc(t.remark)}</textarea>
 <div class="two"><div><label>Status</label><select id="f3">${S.map(s=>`<option${s===t.status?' selected':''}>${s}</option>`).join('')}</select></div><div><label>Date</label><input type="date" id="f4" value="${t.date||''}"></div></div>
 <label>Time</label><input type="time" id="f5" value="${t.time||''}"><label>Reminder (text only)</label><textarea id="f6">${esc(t.reminder)}</textarea>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn g" data-a="x">Cancel</button><button class="btn" data-a="st" data-id="${t.id||''}">Save task</button></div>`);$('#f1').focus()}
function noteForm(n){n=n||{date:TD()};modal(`<h2>${n.id?'Edit note':'New note'}</h2><label>Date</label><input type="date" id="g1" value="${n.date}"><label>Remark</label><textarea id="g2" style="min-height:140px">${esc(n.remark)}</textarea>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn g" data-a="x">Cancel</button><button class="btn" data-a="sn" data-id="${n.id||''}">Save note</button></div>`);$('#g2').focus()}
function conf(msg,act,id){modal(`<h2>Delete?</h2><p>${msg}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" data-a="x">Keep it</button><button class="btn" data-a="${act}" data-id="${id}">Delete</button></div>`)}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
 if(e.target.id==='mo'||g('[data-a=x]'))return close();
 if(x=g('[data-v]')){V=x.dataset.v;render();return scrollTo(0,0)}
 if(x=g('[data-a]')){const a=x.dataset.a,id=x.dataset.id;
  if(a==='addt')return taskForm(null,x.dataset.date);if(a==='addn')return noteForm();
  if(a==='st'){const title=$('#f1').value.trim();if(!title){$('#f1').focus();return}const o={title,remark:$('#f2').value,status:$('#f3').value,date:$('#f4').value,time:$('#f5').value,reminder:$('#f6').value};
   if(id)Object.assign(D.tasks.find(t=>t.id===id),o);else D.tasks.push({id:uid(),...o});save();close();return render()}
  if(a==='sn'){const remark=$('#g2').value.trim();if(!remark){$('#g2').focus();return}const o={date:$('#g1').value||TD(),remark};
   if(id)Object.assign(D.notes.find(n=>n.id===id),o);else D.notes.push({id:uid(),pin:0,...o});save();close();return render()}
  if(a==='dt'){D.tasks=D.tasks.filter(t=>t.id!==id);save();close();return render()}
  if(a==='dn'){D.notes=D.notes.filter(n=>n.id!==id);save();close();return render()}}
 if(x=g('[data-f]')){F.st=x.dataset.f;return render()}
 if(x=g('[data-e]'))return taskForm(D.tasks.find(t=>t.id===x.dataset.e));
 if(x=g('[data-d]'))return conf('This task will be removed permanently. Mark it Completed instead to keep it.','dt',x.dataset.d);
 if(x=g('[data-en]'))return noteForm(D.notes.find(n=>n.id===x.dataset.en));
 if(x=g('[data-dn]'))return conf('This note will be removed permanently.','dn',x.dataset.dn);
 if(x=g('[data-pn]')){const n=D.notes.find(n=>n.id===x.dataset.pn);n.pin=n.pin?0:1;save();return render()}
 if(x=g('[data-x]'))return x.classList.toggle('open');
 if(x=g('[data-cn]')){const k=+x.dataset.cn;if(!k){cal={y:0}}else{cal.m+=k;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}}return render()}
 if(x=g('[data-t]'))return taskForm(D.tasks.find(t=>t.id===x.dataset.t));
 if(x=g('[data-day]')){cal.sel=x.dataset.day;return render()}
 if(g('#clr')){F={q:'',st:'All',scope:'all',date:'',sort:'date'};return render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.classList.contains('st')){D.tasks.find(k=>k.id===t.dataset.id).status=t.value;save();return render()}
 if(t.id==='scope'){F.scope=t.value;list()}if(t.id==='sort'){F.sort=t.value;list()}if(t.id==='fdate'){F.date=t.value;list()}if(t.id==='ns'){NF.sort=t.value;nlist()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;list()}if(e.target.id==='nq'){NF.q=e.target.value;nlist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
